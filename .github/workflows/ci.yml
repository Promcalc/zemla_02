name: Build and Push Docker Images

on:
  push:
    branches: [ main ]
    tags: [ 'v*', '*.*.*' ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: docker.io
  IMAGE_NAME_COLLECTOR: your-dockerhub-username/lot-collector
  IMAGE_NAME_WEB: your-dockerhub-username/lot-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Получить все теги для определения версии

    - name: Determine version
      id: version
      run: |
        # Определяем версию из тега или используем latest
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
          # Убираем префикс 'v' если он есть
          VERSION=${VERSION#v}
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "IS_RELEASE=true" >> $GITHUB_ENV
        else
          VERSION="latest"
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "IS_RELEASE=false" >> $GITHUB_ENV
        fi
        
        # Определяем короткий хеш коммита
        SHORT_SHA=$(git rev-parse --short HEAD)
        echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
        
        echo "Determined version: $VERSION"
        echo "Is release: $IS_RELEASE"
        echo "Short SHA: $SHORT_SHA"

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push collector image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ${{ env.IMAGE_NAME_COLLECTOR }}:${{ env.RELEASE_VERSION }}
          ${{ env.IMAGE_NAME_COLLECTOR }}:${{ env.SHORT_SHA }}
          ${{ steps.version.outputs.IS_RELEASE == 'true' && env.IMAGE_NAME_COLLECTOR + ':latest' || '' }}
        build-args: |
          APP=collector
          GO_VERSION=1.25
          VERSION=${{ env.RELEASE_VERSION }}
          COMMIT_SHA=${{ github.sha }}
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

    - name: Build and push web image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ${{ env.IMAGE_NAME_WEB }}:${{ env.RELEASE_VERSION }}
          ${{ env.IMAGE_NAME_WEB }}:${{ env.SHORT_SHA }}
          ${{ steps.version.outputs.IS_RELEASE == 'true' && env.IMAGE_NAME_WEB + ':latest' || '' }}
        build-args: |
          APP=web
          GO_VERSION=1.25
          VERSION=${{ env.RELEASE_VERSION }}
          COMMIT_SHA=${{ github.sha }}
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

    - name: Display version information
      if: github.event_name != 'pull_request'
      run: |
        echo "Build completed for version: ${{ env.RELEASE_VERSION }}"
        echo "Commit SHA: ${{ github.sha }}"
        echo "Short SHA: ${{ env.SHORT_SHA }}"
        echo "Is release: ${{ env.IS_RELEASE }}"
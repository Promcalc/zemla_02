version: '3.8'

services:
  collector:
    image: your-dockerhub-username/lot-collector:${VERSION:-latest}
    environment:
      - DB_URL=postgres://postgres:${POSTGRES_PASSWORD}@db:5432/lots?sslmode=disable
      - RSS_URL=${RSS_URL}
      - COLLECTOR_SCHEDULE_INTERVAL=${COLLECTOR_SCHEDULE_INTERVAL:-15m}
      - COLLECTOR_RETRY_INTERVAL=${COLLECTOR_RETRY_INTERVAL:-1h}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  web:
    image: your-dockerhub-username/lot-web:${VERSION:-latest}
    ports:
      - "${WEB_PORT:-8000}:8000"
    environment:
      - DB_URL=postgres://postgres:${POSTGRES_PASSWORD}@db:5432/lots?sslmode=disable
      - WEB_PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: lots
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - lot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lots"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  db_

networks:
  lot-network:
    driver: bridge